services:
  - type: web
    name: fxh-forex-crypto-watcher
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MONITOR_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEVELOPER_CHAT_ID
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MONITOR_SECRET_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
